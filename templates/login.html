<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScottFlix Login</title>
    <style>
        :root {
            --netflix-red: #e50914;
            --red-soft: #ff4a54;
            --bg: #090909;
            --text: #ffffff;
            --muted: #b8b8b8;
            --line: rgba(255, 255, 255, 0.16);
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            margin: 0;
            padding: clamp(18px, 5vw, 42px);
            background:
                linear-gradient(90deg, rgba(9, 9, 9, 0.96), rgba(9, 9, 9, 0.68)),
                linear-gradient(0deg, var(--bg), rgba(9, 9, 9, 0.12)),
                url("https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&w=1800&q=80") center / cover;
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image: linear-gradient(rgba(255, 255, 255, 0.026) 1px, transparent 1px);
            background-size: 100% 4px;
            opacity: 0.24;
        }

        .login-panel {
            width: min(440px, 100%);
            perspective: 1000px;
        }

        .brand {
            margin-bottom: 22px;
            color: var(--netflix-red);
            font-size: clamp(2.3rem, 8vw, 3.8rem);
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 0 16px 38px rgba(229, 9, 20, 0.34);
        }

        form {
            display: grid;
            gap: 16px;
            padding: clamp(24px, 6vw, 34px);
            background: rgba(0, 0, 0, 0.68);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: 0 28px 90px rgba(0, 0, 0, 0.72);
            backdrop-filter: blur(16px);
            transform-style: preserve-3d;
            transition: transform 190ms ease, border-color 190ms ease;
        }

        form:hover,
        form:focus-within {
            transform: translateY(-4px) rotateX(1deg);
            border-color: rgba(255, 255, 255, 0.28);
        }

        h1 {
            margin: 0;
            font-size: clamp(1.65rem, 6vw, 2.1rem);
            line-height: 1.05;
        }

        p {
            margin: 0;
            color: var(--muted);
            line-height: 1.45;
        }

        input {
            width: 100%;
            height: 52px;
            padding: 0 14px;
            color: var(--text);
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--line);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 160ms ease, background 160ms ease, box-shadow 160ms ease;
        }

        input:focus {
            border-color: rgba(255, 255, 255, 0.58);
            background: rgba(255, 255, 255, 0.11);
            box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.18);
        }

        button {
            height: 50px;
            border: 0;
            border-radius: 6px;
            color: var(--text);
            background: linear-gradient(180deg, var(--red-soft), var(--netflix-red));
            cursor: pointer;
            font-weight: 900;
            font-size: 1rem;
            box-shadow: 0 16px 38px rgba(229, 9, 20, 0.34);
            transition: transform 180ms ease, box-shadow 180ms ease;
        }

        button:hover,
        button:focus {
            transform: translateY(-2px);
            box-shadow: 0 20px 46px rgba(229, 9, 20, 0.42);
            outline: none;
        }

        .error {
            color: #ffb4b8;
            font-weight: 800;
        }

        @media (max-width: 480px) {
            body {
                align-items: end;
                padding-bottom: 28px;
            }

            .brand {
                font-size: 2.1rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition-duration: 0.01ms !important;
                animation-duration: 0.01ms !important;
            }

            form:hover,
            form:focus-within,
            button:hover,
            button:focus {
                transform: none;
            }
        }
    </style>
</head>
<body>
    <main class="login-panel">
        <div class="brand">ScottFlix</div>
        <form action="/login" method="post">
            <h1>Enter Passcode</h1>
            <p>Your movie shelf is private.</p>
            {% if error %}
            <p class="error">{{ error }}</p>
            {% endif %}
            <input type="password" name="passcode" placeholder="Passcode" autocomplete="current-password" required autofocus>
            <button type="submit">Unlock</button>
        </form>
    </main>
</body>
</html>
